<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Esempio CSS Grid</title>
    <style>
        /* Contenitore principale impostato a griglia */
        .grid {
            display: grid;
            grid-gap: 20px;
            padding: 20px;
            background-color: #9acd32; /* Tonalità di verde visibile nell'anteprima */
        }

        /* Singoli elementi interni alla griglia */
        .elementi {
            background-color: yellow;
            text-align: center;
            padding: 20px;
            font-family: Arial, sans-serif;
            font-weight: bold;
        }
    </style>
</head>
<body>

    <div class="grid">
        <div class="elementi">Elemento 1</div>
        <div class="elementi">Elemento 2</div>
        <div class="elementi">Elemento 3</div>
    </div>

</body>
</html>
