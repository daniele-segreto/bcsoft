<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Esempio Pratico Z-Index</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 40px;
            color: #333;
            background-color: #f4f4f4;
        }

        .container {
            position: relative; /* IMPORTANTE: non deve essere static */
            width: 400px;
            height: 400px;
            background-color: #ddd;
            border: 2px solid #333;
        }

        /* Stile comune dei box sovrapposti */
        .box {
            position: absolute; /* IMPORTANTE: un elemento a cui diamo z-index non deve essere "static" */
            width: 180px;
            height: 180px;
            padding: 15px;
            color: white;
            font-weight: bold;
            border-radius: 8px;
            box-shadow: 0 4px 8px rgba(0,0,0,0.2);
        }

        /* Box 1: Sfondo basso */
        .box-1 {
            background-color: #e74c3c; /* Rosso */
            top: 30px;
            left: 30px;
            z-index: 1; /* Il più basso nella pila */
        }

        /* Box 2: Strato intermedio */
        .box-2 {
            background-color: #3498db; /* Blu */
            top: 90px;
            left: 90px;
            z-index: 2; /* Sta sopra al box rosso */
        }

        /* Box 3: Primo piano assoluto */
        .box-3 {
            background-color: #2ecc71; /* Verde */
            top: 150px;
            left: 150px;
            z-index: 3; /* Sta sopra a tutti */
        }
    </style>
</head>
<body>

    <h1>Dimostrazione della proprietà z-index</h1>
    <p>I box si sovrappongono: osserva come l'ordine visivo sia dettato dai valori di z-index indipendentemente dalla posizione nel codice HTML.</p>

    <div class="container">
        <div class="box box-1">Box 1 (z-index: 1)</div>
        <div class="box box-2">Box 2 (z-index: 2)</div>
        <div class="box box-3">Box 3 (z-index: 3)</div>
    </div>

</body>
</html>
