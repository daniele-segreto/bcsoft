<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>List style image</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 40px;
            color: #333;
            background-color: #ffffff;
        }

        /* Personalizzazione della lista non ordinata con un'immagine personalizzata */
        ul {
            list-style-image: url('https://carlswebgraphics.com/bullets/bullet-10.gif');
            padding-left: 60px;
        }

        /* Stilizzazione dei singoli elementi della lista */
        li {
            font-size: 18px;
            padding-bottom: 10px;
        }
    </style>
</head>
<body>

    <!-- Lista non ordinata che sfrutta l'immagine personalizzata come punto elenco -->
    <ul>
        <li>Elemento 1</li>
        <li>Elemento 2</li>
        <li>Elemento 3</li>
    </ul>

</body>
</html>
