<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Confronto Table Layout: Auto vs Fixed</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 40px;
            color: #333;
            background-color: #ffffff;
        }

        /* Stile comune per i bordi delle celle */
        td {
            border: 3px solid blue;
            padding: 8px;
            text-align: center;
        }

        /* 1. Layout automatico basato sul contenuto */
        #auto {
            table-layout: auto;
            width: 120px;
            border: 3px solid red;
            border-collapse: collapse;
            margin-bottom: 30px;
        }

        /* 2. Layout fisso basato sulle dimensioni impostate */
        #fixed {
            table-layout: fixed;
            width: 120px;
            border: 3px solid red;
            border-collapse: collapse;
        }
    </style>
</head>
<body>

    <h3>Tabella 1: table-layout: auto</h3>
    <!-- Il browser allarga la tabella per fare spazio alla parola lunga "Rinascimento" -->
    <table id="auto">
        <tr>
            <td>Fabio</td>
            <td>Amato</td>
        </tr>
        <tr>
            <td>Luca</td>
            <td>Rinascimento</td>
        </tr>
    </table>

    <h3>Tabella 2: table-layout: fixed</h3>
    <!-- La tabella mantiene rigidamente la larghezza impostata di 120px, forzando il contenuto -->
    <table id="fixed">
        <tr>
            <td>Fabio</td>
            <td>Amato</td>
        </tr>
        <tr>
            <td>Luca</td>
            <td>Rinascimento</td>
        </tr>
    </table>

</body>
</html>
