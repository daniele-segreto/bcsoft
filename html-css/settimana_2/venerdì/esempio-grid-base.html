<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Introduzione a CSS Grid</title>
    <style>
        /* 1. Il Contenitore della Griglia */
        .griglia-contenitore {
            display: grid;
            /* Creiamo 3 colonne di ugual misura (1 frazione ciascuna) */
            grid-template-columns: repeat(3, 1fr);
            /* Definiamo l'altezza delle due righe */
            grid-template-rows: 150px 150px;
            /* Aggiungiamo uno spazio di 15 pixel tra le celle */
            gap: 15px;
            max-width: 800px;
            margin: 40px auto;
        }

        /* 2. Stile estetico per gli elementi figli */
        .cella {
            background-color: #2c3e50;
            color: white;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: Arial, sans-serif;
            font-size: 20px;
            font-weight: bold;
            border-radius: 8px;
        }

        /* Esempio di elemento che si estende su più colonne */
        .largo {
            grid-column: span 2; /* Occupa lo spazio di 2 colonne */
            background-color: #e74c3c;
        }
    </style>
</head>
<body>

    <div class="griglia-contenitore">
        <div class="cella largo">1 (Occupa 2 colonne)</div>
        <div class="cella">2</div>
        <div class="cella">3</div>
        <div class="cella">4</div>
        <div class="cella">5</div>
    </div>

</body>
</html>
