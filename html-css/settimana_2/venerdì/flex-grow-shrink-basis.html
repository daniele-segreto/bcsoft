<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Flex grow, shrink e basis</title>
    <style>
        /* Contenitore Flexbox con sfondo rosso */
        .container {
            display: flex;
            background-color: red;
        }

        /* Stile di base per tutti gli elementi figli diretti del contenitore */
        .container > div {
            background-color: orange;
            color: white;
            width: 100px;
            margin: 10px;
            text-align: center;
            line-height: 100px;
            font-size: 20px;
        }
    </style>
</head>
<body>

    <h1 style="text-align: center; margin-bottom: 70px;">Flex-grow, shrink, basis</h1>
    <h3 style="text-align: center; margin-bottom: 30px;">Aumenta o diminuisci lo spazio della finestra del browser</h3>

    <div class="container">
        <!-- 1. flex-shrink: l'elemento si rimpicciolisce più velocemente degli altri se lo spazio si riduce -->
        <div style="flex-shrink: 3;">1</div>
        
        <!-- 2. flex-basis: imposta la dimensione di partenza ideale dell'elemento prima che si distribuisca lo spazio -->
        <div style="flex-basis: 300px;">2</div>
        
        <!-- 3. flex-grow: l'elemento cresce occupando 1 parte dello spazio disponibile in eccesso -->
        <div style="flex-grow: 1;">3</div>
        
        <!-- 4. flex-grow: l'elemento cresce occupando 10 parti dello spazio disponibile in eccesso -->
        <div style="flex-grow: 10;">4</div>
    </div>

</body>
</html>
