<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Test Flexbox Layout - Responsive</title>
    <link rel="stylesheet" href="css/esercizio_2B.css">
</head>
<body>
    <!-- Contenitore principale Flexbox (disposizione in colonna) -->
    <div class="container">
        <div class="header-container">
            <div class="header">HEADER</div>
        </div>
        
        <!-- Riga intermedia per Sidebar, Main e Aside -->
        <div class="main-container">
            <div class="sidebar">SIDEBAR</div>
            <div class="main">MAIN</div>
            <div class="aside">ASIDE</div>
        </div>
        
        <!-- Footer -->
        <div class="footer-container">
            <div class="footer">FOOTER</div>
        </div>
    </div>
</body>
</html>
