<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Esempio Pseudo-classe Focus</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 40px;
            background-color: #f4f4f9;
            color: #333;
        }

        .form-group {
            margin-bottom: 20px;
        }

        label {
            display: block;
            margin-bottom: 5px;
            font-weight: bold;
        }

        /* Stile di base per i campi di input */
        input[type="text"],
        input[type="email"] {
            width: 100%;
            max-width: 400px;
            padding: 10px;
            border: 2px solid #ccc;
            border-radius: 6px;
            font-size: 16px;
            outline: none; /* Rimuove il bordo di default del browser */
            transition: all 0.3s ease;
        }

        /* Effetto :focus: si attiva quando l'utente clicca o seleziona il campo */
        input[type="text"]:focus,
        input[type="email"]:focus {
            border-color: #ff0000;
            background-color: #fff;
            box-shadow: 0 0 8px rgb(202, 219, 52);
        }
    </style>
</head>
<body>

    <h2>Modulo di Registrazione</h2>
    <form>
        <div class="form-group">
            <label for="nome">Nome:</label>
            <input type="text" id="nome" name="nome" placeholder="Clicca o premi Tab qui...">
        </div>

        <div class="form-group">
            <label for="email">Email:</label>
            <input type="email" id="email" name="email" placeholder="Inserisci la tua email...">
        </div>
    </form>

</body>
</html>
