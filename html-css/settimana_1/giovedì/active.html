<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Esempio Pseudo-classe Active</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 40px;
            background-color: #fdfdfd;
            text-align: center;
        }

        .button {
            display: inline-block;
            padding: 20px 20px;
            background-color: cadetblue;
            color: white;
            font-weight: bold;
            text-decoration: none;
            border-radius: 20px;
            cursor: pointer;
        }

        .button:active {
            background-color: blue;
        }
    </style>
</head>
<body>

    <a href="#" class="button">CLICCA QUI</a>

</body>
</html>
