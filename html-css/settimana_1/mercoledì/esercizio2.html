<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Esercizio sui Form - Parte 2</title>
    <link rel="stylesheet" href="css/style2.css">
</head>
<body>
    
    <h1>Esercizio sui Form - Parte 2</h1>
    
    <!-- FORM (action, metod, target) -->
    <form action="ricevi-dati.php" method="POST" target="_blank">
        
        <!-- Gruppo 1: ANAGRAFICA (nome, biografia) -->
        <fieldset>
            <legend>Anagrafica</legend>
            
            <!-- Nome (text) -->
            <div class="form-group">
                <label for="nome">Nome:</label>
                <input type="text" id="nome" name="nome" placeholder="Inserisci il tuo nome" required>
            </div>
            
            <!-- Biografia (textarea) -->
            <div class="form-group">
                <label for="biografia">Biografia:</label>
                <!-- Textarea con testo segnaposto e dimensioni predefinite (righe e colonne) -->
                <textarea id="biografia" name="biografia" rows="4" cols="30" placeholder="Scrivi una breve biografia..."></textarea>
            </div>
        </fieldset>
        
        <!-- Gruppo 2: PREFERENZE e COMPETENZE (radio e checkbox) -->
        <fieldset>
            <legend>Preferenze e Competenze</legend>
            
            <!-- RADIO BUTTON (scelta singola) -->
            <div class="form-group">
                <label>Livello di esperienza:</label>
                
                <!-- Livello base -->
                <input type="radio" id="liv-base" name="livello" value="base">
                <label for="liv-base" style="width: auto; font-weight: normal;">Base</label>
                
                <!-- Livello avanzato -->
                <input type="radio" id="liv-avanzato" name="livello" value="avanzato" checked>
                <label for="liv-avanzato" style="width: auto; font-weight: normal;">Avanzato</label>
            </div>
            
            <!-- CHECHBOX (scelta multipla) -->
            <div class="form-group">
                <label>Tecnologie preferite:</label>
                
                <!-- HTML/CSS -->
                <input type="checkbox" id="tech-html" name="tecnologie" value="HTML">
                <label for="tech-html" style="width: auto; font-weight: normal;">HTML/CSS</label>
                
                <!-- JavaScript -->
                <input type="checkbox" id="tech-js" name="tecnologie" value="JS">
                <label for="tech-js" style="width: auto; font-weight: normal;">JavaScript</label>
            </div>
        </fieldset>
        
        <!-- Gruppo 3: CORSI E SELEZIONI (select, option, optgroup e selezione multipla) -->
        <fieldset>
            <legend>Corsi e Selezioni</legend>
            
            <!-- CORSO DI INTERESSE (optgroup e opzione suggerita/predefinita) -->
            <div class="form-group">
                <label for="corso">Corso di interesse:</label>
                <select id="corso" name="corso">
                    
                    <!-- Opzione predefinita -->
                    <option value="" disabled selected>-- Scegli un'opzione --</option>
                    
                    <!-- Opzioni Frontend -->
                    <optgroup label="Frontend">
                        <option value="html-css">HTML & CSS Fondamenti</option>
                        <option value="js-avanzato">JavaScript Avanzato</option>
                    </optgroup>
                    
                    <!-- Opzioni Backend -->
                    <optgroup label="Backend">
                        <option value="php-laravel">PHP e Laravel</option>
                    </optgroup>
                </select>
            </div>
            
            <!-- INTERESSI -->
            <div class="form-group">
                <label for="hobbies">Interessi (multipla):</label>
                
                <!-- Selezione multipla e size -->
                <select id="hobbies" name="hobbies" multiple size="3">
                    <option value="programmazione">Programmazione</option>
                    <option value="scienza">Scienza Partecipata</option>
                    <option value="lettura">Lettura</option>
                </select>
            </div>
        </fieldset>
        
        <!-- PULSANTE DI INVIO -->
        <div class="form-group">
            <input type="submit" value="Invia Modulo" style="padding: 8px 16px; background-color: #0056b3; color: white; border: none; border-radius: 4px; cursor: pointer;">
        </div>
        
    </form>
    
    <hr>
    
    <!-- Intestazione della sezione dedicata alla ricerca esterna -->
    <h2>Ricerca su Wikipedia</h2>
    
    <!-- RICERCA WIKIPEDIA -->
    <!-- 
    Modulo (<form>) configurato per interagire direttamente con il motore di ricerca di Wikipedia.
        - action: definisce l'URL dello script di destinazione ufficiale (versione italiana).
        - method="get": accoda i dati inseriti direttamente all'URL sotto forma di parametri di query.
        - target="_blank": impone l'apertura della pagina dei risultati in una nuova scheda del browser.
        -->
        <form id="searchForm" action="https://it.wikipedia.org/w/index.php" method="get" target="_blank">
            
            <!-- Etichetta testuale collegata al campo tramite l'attributo 'for' per garantire l'accessibilità (A11y) -->
            <label for="searchInput">Cerca su Wikipedia:</label>
            
            <!-- 
            Campo di input di tipo ricerca.
            - type="search": ottimizza la grafica e la tastiera sui dispositivi mobili.
            - name="search": parametro obbligatorio intercettato dallo script di Wikipedia per la chiave di ricerca.
            - placeholder: offre un suggerimento testuale visibile finché il campo è vuoto.
            -->
            <input type="search" id="searchInput" name="search" placeholder="Scrivi qui cosa ricercare">
            
            <!-- Pulsante semantico per l'invio del modulo -->
            <button type="submit">Cerca</button>
            
        </form>
        
        <!-- RICERCA GOOGLE -->
        <form id="searchForm" action="https://www.google.com/search" method="get" target="_blank">
            <label for="searchInput">Cerca su Google:</label>
            <input type="search" id="searchInput" name="q" placeholder="Scrivi qui cosa ricercare">
            <button type="submit">Cerca</button>
        </form>
        
        <!-- RICERCA YOUTUBE -->
        <form id="searchForm" action="https://www.youtube.com/results" method="get" target="_blank">
            <label for="searchInput">Cerca su Youtube:</label>
            <input type="search" id="searchInput" name="search_query" placeholder="Scrivi qui cosa ricercare">
            <button type="submit">Cerca</button>
        </form>
        
        <hr>
        
        <!-- PASSWORD -->
        <form action="#" method="post">
            <label for="password">PASSWORD:</label>
            <input type="password" id="password" name="password" 
            minlength="8" 
            maxlength="20" 
            pattern="^(?=.*[a-z])(?=.*[A-Z])(?=.*\d)(?=.*[@$!%*?&])[A-Za-z\d@$!%*?&]{8,}$" 
            title="La password deve contenere tra gli 8 e i 20 caratteri, di cui uno minuscolo, uno maiuscolo, un numero e un carattere speciale" 
            required>
            
            <input type="submit" value="Invia" />
        </form>

        <hr>
        
        <!-- FANTACALCIO (punti a step) -->
        <h2>Punti relativi alle vittorie al Fantacalcio <br> delle prime cinque partite di campionato</h2>
        
        <form>
            <label for="pointsFabio">Fabio:</label>
            <input type="number" id="pointsFabio" name="pointsFabio" min="0" step="3" max="15">
            <br><br>
            
            <label for="pointsLucas">Lucas:</label>
            <input type="number" id="pointsLucas" name="pointsLucas" min="0" step="3" max="15">
            <br><br>
            
            <label for="pointsPaolo">Paolo:</label>
            <input type="number" id="pointsPaolo" name="pointsPaolo" min="0" step="3" max="15">
            <br><br>
            
            <input type="submit" value="Invia">
        </form>

        <hr>
        
        <!-- COLORI -->
        <form action="/submit_form.php" method="POST">
            <label for="nome">Nome e Cognome:</label><br>
            <input type="text" id="nome" name="nome"><br>
            
            <label for="email">Email:</label><br>
            <input type="email" id="email" name="email"><br><br>
            
            <label for="fav">Seleziona il tuo colore preferito:</label>
            <input type="color" id="fav" name="fav">
            <br><br>
            
            <input type="submit" value="Invia">
        </form>

        <hr>
        
        <!-- INPUT FILE -->
        <form id="fileUploadForm" action="/upload" method="post" enctype="multipart/form-data">
            <label for="fileInput">Seleziona un file:</label>
            <br><br>
            <input type="file" id="fileInput" name="fileInput" accept=".jpg, .jpeg, .png" required>
            <br><br><br>
            <button type="submit">Carica</button>
            <button type="reset">Annulla selezione</button>
        </form>

        <hr>
        
        <!-- MODULO DI ASSISTENZA: INPUT LIST & DATALIST -->
        <h2>Modulo di Assistenza</h2>
        
        <form action="/submit_form.php" method="POST">
            <label for="nome">Nome e Cognome:</label><br>
            <input type="text" id="nome" name="nome" required><br>
            
            <label for="email">Email:</label><br>
            <input type="email" id="email" name="email" required><br><br>
            
            <label for="browser">Browser utilizzato:</label><br>
            <input list="browsers" required>
            <datalist id="browsers">
                <option value="Chrome">
                <option value="Firefox">
                <option value="Microsoft Edge">
                <option value="Safari">
            </datalist>

            <br><br>
                            
            <input type="submit" value="Invia">
        </form>

        <hr>
                        
</body>
</html>
