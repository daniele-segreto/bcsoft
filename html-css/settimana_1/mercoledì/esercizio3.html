<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Esercizio sui Form - Parte 3</title>
    <link rel="stylesheet" href="css/style3.css">
</head>
<body>
    
    <form action="https://www.google.com/search">
        <h1>STAMPA LA TUA T-SHIRT</h1>
        
        <!-- RICERCA (type=search) -->
        <div class="form-group">
            <label for="ricerca">Ricerca T-Shirt:</label>
            <input type="search" id="ricerca" name="q" placeholder="Cerca la tua t-shirt" title="Inserisci il termine o la parola chiave da ricercare" required>
        </div>
        
        <!-- NOME  -->
        <div class="form-group">
            <label for="name">Nome:</label>
            <input type="text" id="name" name="name" title="Inserisci il tuo nome" placeholder="Inserisci il tuo nome" required>
        </div>

        <!-- COGNOME  -->
        <!-- <div class="form-group">
            <label for="surname">Cognome:</label>
            <input type="text" id="surname" name="surname" title="Inserisci il tuo cognome" placeholder="Inserisci il tuo cognome" required>
        </div> -->

        <!-- EMAIL  -->
        <div class="form-group">
            <label for="email">Email:</label>
            <input type="email" id="email" name="email" title="Inserisci la tua e-mail" placeholder="Inserisci la tue email" required>
        </div>
        
        <!-- PASSWORD (type=password, con di password prefissati: lettera minuscola, lettera maiuscola, set dicaratteri speciali, numeri e di una lunghezza minima)  -->
        <div class="form-group">
            <label for="password">Password:</label>
            <input type="password" id="password" name="password" minlength="8" maxlength="16" pattern="(?=.*\d)(?=.*[a-z])(?=.*[A-Z])(?=.*[\W_]).{8,}" title="La password deve contenere almeno 8 caratteri, una lettera maiuscola, una minuscola, un numero e un carattere speciale." placeholder="Inserisci la tua password" required>
        </div>
        
        <!-- FILE (type=file, con range di estensioni file ammesse) -->
        <div class="form-group">
            <label for="documento">Carica logo:</label>
            <input type="file" id="documento" name="documento" accept=".pdf, .jpg, .jpeg, .png" title="Seleziona un file in formato PDF o immagini (.jpg, .jpeg, .png)" required>
        </div>
        
        <!-- CAMPO NUMERICO (type=number, con attributi min, max, step) -->
        <div class="form-group">
            <label for="quantita">Quantità:</label>
            <input type="number" id="quantita" name="quantita" min="0" max="100" step="5" value="10" title="Inserisci un valore numerico compreso tra 0 e 100, con incrementi di 5" required>
        </div>

        <!-- INDIRIZZO  -->
        <div class="form-group">
            <label for="address">Indirizzo di spedizione:</label>
            <input type="text" id="address" name="address" title="Inserisci il tuo indirizzo" placeholder="Inserisci il tuo indirizzo" required>
        </div>
        
        <!-- DATETIME LOCAL (type=datetime-local, con data successiva al 1 gennaio 2024 ad ora) -->
        <div class="form-group">
            <label for="data-evento">Data e ora spedizione:</label>
            <input type="datetime-local" id="data-evento" name="data_evento" min="2024-01-01T00:00" title="Seleziona una data e ora successiva al 1° gennaio 2024" required>
        </div>
        
        <!-- SELETTORE COLORE (type=color) -->
        <div class="form-group">
            <label for="colore">Colore t-shirt:</label>
            <input type="color" id="colore" name="colore" value="#e73042" title="Seleziona il colore desiderato tramite la tavolozza" required>
        </div>
        
        <!-- PULSANTI (type=submit e type=reset, con caratteri UNICODE) -->
        <div class="form-actions">
            <button type="submit">&#9658;&nbsp;&nbsp;INVIA MODULO</button>
            <input type="reset" value="&#10006;&nbsp;&nbsp;PULISCI CAMPI">
        </div>
    </form>
    
</body>
</html>
