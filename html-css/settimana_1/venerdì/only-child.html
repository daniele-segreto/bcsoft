<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Guida alla Pseudo-classe only-child</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            line-height: 1.6;
            margin: 40px;
            background-color: #fdfdfd;
            color: #333;
        }

        h1 {
            color: #2c3e50;
            border-bottom: 2px solid #3498db;
            padding-bottom: 10px;
        }

        .box {
            background: #f1f2f6;
            border: 1px solid #dcdde1;
            padding: 20px;
            margin-bottom: 25px;
            border-radius: 8px;
        }

        /* Stile che sarà applicato solo all'elemento figlio unico */
        /* Seleziona l'elemento con classe .pippo solo se è l'unico figlio del suo genitore */
        .pippo:only-child {
            color: red;
            font-weight: bold;
        }
    </style>
</head>
<body>

    <h1>Esempio della Pseudo-classe :only-child</h1>

    <!-- Primo contenitore: l'elemento .pippo è l'unico figlio -->
    <div class="box">
        <div class="pippo">Sono l'unico figlio. Davvero. (Questo testo diventerà ROSSO e in GRASSETTO)</div>
    </div>

    <!-- Secondo contenitore: l'elemento .pippo NON è l'unico figlio (c'è un fratello) -->
    <div class="box">
        <div class="pippo">Sono l'unico figlio. Sicuro? (Questo testo NON si colora perché ha un fratello)</div>
        <div>Sono un altro figlio.</div>
    </div>

</body>
</html>
