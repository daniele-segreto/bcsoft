<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Guida alle Pseudo-classi first-of-type e last-of-type</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            line-height: 1.6;
            margin: 40px;
            background-color: #fdfdfd;
            color: #333;
        }

        h1 {
            color: #2c3e50;
            border-bottom: 2px solid #3498db;
            padding-bottom: 10px;
        }

        .box {
            background: #f1f2f6;
            border: 1px solid #dcdde1;
            padding: 20px;
            margin-bottom: 25px;
            border-radius: 8px;
        }

        /* Regola generale di base per tutti i paragrafi */
        p {
            color: #555;
        }

        /* Stile applicato al primo paragrafo di tipo p all'interno del genitore */
        p:first-of-type {
            color: red;
            font-weight: bold;
        }

        /* Stile applicato all'ultimo paragrafo di tipo p all'interno del genitore */
        p:last-of-type {
            color: blue;
            font-weight: bold;
        }
    </style>
</head>
<body>

    <h1>Esempio delle Pseudo-classi :first-of-type e :last-of-type</h1>

    <div class="box">
        <!-- Primo paragrafo (primo del suo tipo): diventa ROSSO e in GRASSETTO -->
        <p>Questo è il primo paragrafo</p>

        <!-- Secondo paragrafo (intermedio): mantiene il colore standard -->
        <p>Questo è il secondo paragrafo</p>

        <!-- Terzo paragrafo (intermedio): mantiene il colore standard -->
        <p>Questo è il terzo paragrafo</p>

        <!-- Quarto paragrafo (intermedio): mantiene il colore standard -->
        <p>Questo è il quarto paragrafo</p>

        <!-- Quinto paragrafo (ultimo del suo tipo): diventa BLU e in GRASSETTO -->
        <p>Questo è il quinto paragrafo</p>
    </div>

</body>
</html>
