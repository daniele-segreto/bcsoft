<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Guida alla Pseudo-classe nth-last-child</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            line-height: 1.6;
            margin: 40px;
            background-color: #fdfdfd;
            color: #333;
        }

        h1 {
            color: #2c3e50;
            border-bottom: 2px solid #3498db;
            padding-bottom: 10px;
        }

        .box {
            background: #f1f2f6;
            border: 1px solid #dcdde1;
            padding: 20px;
            margin-bottom: 25px;
            border-radius: 8px;
        }

        /* Regola generale: tutti i paragrafi partono con il colore nero */
        p {
            color: black;
        }

        /* Stile per il quarto paragrafo figlio dalla fine di un elemento */
        /* Conta 4 posizioni partendo dall'ultimo figlio del div e risalendo verso l'alto */
        p:nth-last-child(4) {
            color: blue;
            font-weight: bold;
        }
    </style>
</head>
<body>

    <h1>Esempio della Pseudo-classe :nth-last-child(4)</h1>

    <div class="box">
        <!-- 5° dal fondo (1° dall'inizio): nero standard -->
        <p>Questo è il primo paragrafo</p>

        <!-- 4° dal fondo (2° dall'inizio): questo rispetta la regola e diventa BLU e in GRASSETTO -->
        <p>Questo è il secondo paragrafo</p>

        <!-- 3° dal fondo: nero standard -->
        <p>Questo è il terzo paragrafo</p>

        <!-- 2° dal fondo: nero standard -->
        <p>Questo è il quarto paragrafo</p>

        <!-- 1° dal fondo (ultimo figlio): nero standard -->
        <p>Questo è il quinto paragrafo</p>
    </div>

</body>
</html>
