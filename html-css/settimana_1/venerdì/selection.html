<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pseudo-elementi selection</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            line-height: 1.6;
            margin: 40px;
            background-color: #fdfdfd;
            color: #333;
        }

        h1 {
            color: #2c3e50;
            border-bottom: 2px solid #3498db;
            padding-bottom: 10px;
        }

        .box {
            background: #f1f2f6;
            border: 1px solid #dcdde1;
            padding: 20px;
            margin-bottom: 25px;
            border-radius: 8px;
        }

        /* Regola applicata esclusivamente alla selezione del testo all'interno dei paragrafi (<p>) */
        p::selection {
            background-color: MediumVioletRed; /* Sfondo personalizzato della selezione */
            color: white;                     /* Colore del testo evidenziato */
        }
    </style>
</head>
<body>

    <h1>Esempio dello Pseudo-elemento ::selection</h1>

    <div class="box">
        <!-- Paragrafo di prova: selezionando il testo comparirà lo stile personalizzato -->
        <p>Seleziona il testo di questo paragrafo con il mouse per vedere la sua stilizzazione.</p>
    </div>

</body>
</html>
