<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Guida a nth-child con parole chiave (even e odd)</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            line-height: 1.6;
            margin: 40px;
            background-color: #fdfdfd;
            color: #333;
        }
        
        h1 {
            color: #2c3e50;
            border-bottom: 2px solid #3498db;
            padding-bottom: 10px;
        }
        
        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 20px;
            background: #fff;
            border: 1px solid #dcdde1;
            border-radius: 8px;
            overflow: hidden;
        }
        
        th, td {
            padding: 12px 15px;
            text-align: left;
            border-bottom: 1px solid #ddd;
        }
        
        th {
            background-color: #2c3e50;
            color: white;
        }
        
        /* Seleziona gli elementi figli che occupano una posizione pari all'interno del loro genitore */
        /* Applicato alle righe della tabella (tr), colora di giallo le righe pari (2ª, 4ª, ecc.) */
        tr:nth-child(even) {
            background-color: yellow;
        }
        
        /* Nota sugli altri valori possibili:
        - odd: seleziona le posizioni dispari (1ª, 3ª, ecc.)
        - n: seleziona tutti i figli
        - 2n: equivalente a even (multipli di 2)
        */
    </style>
</head>
<body>
    
    <h1>Esempio di Tabella con Righe Alternate (even)</h1>
    
    <table>
        <thead>
            <tr>
                <th>ID</th>
                <th>Nome Corso</th>
                <th>Argomento</th>
            </tr>
        </thead>
        <tbody>
            <!-- Riga 1 (Dispari): sfondo bianco standard -->
            <tr>
                <td>1</td>
                <td>HTML & CSS Base</td>
                <td>Struttura e Selettori</td>
            </tr>
            <!-- Riga 2 (Pari): applica lo sfondo giallo -->
            <tr>
                <td>2</td>
                <td>JavaScript Moderno</td>
                <td>DOM e Interazioni</td>
            </tr>
            <!-- Riga 3 (Dispari): sfondo bianco standard -->
            <tr>
                <td>3</td>
                <td>Angular Framework</td>
                <td>Componenti e Moduli</td>
            </tr>
            <!-- Riga 4 (Pari): applica lo sfondo giallo -->
            <tr>
                <td>4</td>
                <td>Git & GitHub</td>
                <td>Controllo Versione</td>
            </tr>
        </tbody>
    </table>
    
</body>
</html>
