<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ciclo for in array</title>
    <style>
        body {
            font-family: sans-serif;
            text-align: center;
            background-color: #f9f9f9;
        }
        h1 {
            font-weight: bold;
            color: #111;
        }
        p {
            font-size: 20px;
            margin-top: 15px;
        }
        /* Stile personalizzato per differenziare le vocali (verdi) dalle consonanti (blu) */
        #output2 {
            color: green;
        }
        #output {
            color: blue;
        }
        #outputcopia {
            font-weight: bold;
            color: #333;
        }
    </style>
</head>
<body>
    
    <h1>Ciclo for in array</h1>
    
    <!-- Paragrafi destinati ad accogliere l'anteprima dell'array e i risultati formattati -->
    <p id="outputcopia"></p>
    <p id="output2"></p>
    <p id="output"></p>
    
    <script>
        // ==========================================
        // 1. DICHIARAZIONE DELL'ARRAY E DELLE VARIABILI
        // ==========================================
        var letters = ['a', 'b', 'c', 'd', 'e', 'x', 'i'];
        var output = "";
        var output2 = "";
        
        // Creazione di una copia di sicurezza dell'array tramite il metodo .slice()
        var lettersOriginale = letters.slice();
        
        // ==========================================
        // 2. SCANSIONE DELL'ARRAY TRAMITE CICLO FOR
        // ==========================================
        /* 
        Il ciclo scorre l'intero array partendo dall'indice 0 fino a raggiungere 
        la dimensione massima definita da letters.length.
        */
        for (var i = 0; i < letters.length; i++) {
            
            // Estrazione e conversione in minuscolo della lettera corrente
            var letter = letters[i].toLowerCase(); // Converto la lettera in minuscolo per facilitare il confronto
            
            // ==========================================
            // 3. LOGICA CONDIZIONALE (VOCALI VS CONSONANTI)
            // ==========================================
            if (letter === 'a' || letter === 'e' || letter === 'i' || letter === 'o' || letter === 'u') {
                output2 += letters[i] + " è una vocale.<br>";
            } else {
                output += letters[i] + " è una consonante.<br>";
            }
        }
        
        // ==========================================
        // 4. AGGIORNAMENTO DINAMICO DEL DOM
        // ==========================================
        document.getElementById("outputcopia").innerHTML = "Tra queste lettere: <br>" + lettersOriginale.join(",");
        document.getElementById("output2").innerHTML = output2;
        document.getElementById("output").innerHTML = output;
    </script>
    
</body>
</html>
