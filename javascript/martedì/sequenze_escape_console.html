<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sequenze di escape</title>
</head>
<body>

    <h1>Console, scelgo te!</h1>
    <p>Utilizziamo la console per visualizzare le sequenze di escape.</p>

    <!-- Blocco script contenente l'utilizzo pratico delle sequenze di escape visualizzate in console -->
    <script>
        // Esempio di salto di riga (\n): interrompe la stringa e va a capo
        console.log('Salto di riga:\nAndiamo a capo!');

        // Esempio di tabulazione (\t): inserisce uno spazio orizzontale fisso
        console.log('Tabulazione: \tTabuliamo questo testo!');

        // Esempio di apostrofo singolo (\'): permette di inserire l'apice senza chiudere la stringa
        console.log('Apostrofo singolo: Scelgo l\'apostrofo!');

        // Esempio di virgolette doppie (\"): inserisce le virgolette all'interno di stringhe delimitate da doppi apici
        console.log("Questo testo contiene le virgolette doppie: \"\"");

        // Esempio di backslash (\\): raddoppia il carattere di escape per stamparlo letteralmente (ti permette di inserire un \)
        console.log('Backslash: Vediamo come inserire un \\ ');

        // Esempio di caratteri Unicode e sequenze di escape estese
        console.log('Per inserire un Unicode o copi direttamente l\'immagine 😃 o usi la sequenza di escape \u{1F600} o \u00A9 ');
    </script>

</body>
</html>
