<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JQuery con metodo per lo stile</title>
    
    <!-- Inclusione della libreria jQuery tramite CDN -->
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>

    <style>
        body {
            font-family: sans-serif;
            margin: 40px;
            text-align: center;
        }
        h1 {
            font-size: 30px;
            margin-bottom: 25px;
        }
        button {
            padding: 8px 15px;
            margin: 5px;
            font-size: 16px;
            cursor: pointer;
        }
        p {
            font-size: 24px;
            margin-top: 30px;
        }
    </style>
</head>
<body>

    <h1>JQuery con metodo per lo stile</h1>
    <br />

    <!-- Pulsanti di controllo -->
    <button id="red">Testo rosso</button>
    <button id="blue">Testo blu</button>
    <button id="black">Ripristina</button>

    <!-- Paragrafo target -->
    <p id="text">Paragrafo da colorare.</p>

    <!-- Script jQuery -->
    <script>
        $(document).ready(function () {
            
            // Colora il testo di rosso al click sul primo pulsante
            $("#red").click(function () {
                $("#text").css("color", "red");
            });

            // Colora il testo di blu al click sul secondo pulsante
            $("#blue").click(function () {
                $("#text").css("color", "blue");
            });

            // Ripristina il colore nero al click sul terzo pulsante
            $("#black").click(function () {
                $("#text").css("color", "black");
            });

        });
    </script>

</body>
</html>
