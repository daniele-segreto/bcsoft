<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JQuery e metodo Text/Val</title>
    
    <!-- Inclusione della libreria jQuery tramite CDN -->
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>

    <style>
        body {
            font-family: sans-serif;
            margin: 40px;
            text-align: center;
        }
        h1 {
            font-size: 30px;
            margin-bottom: 25px;
        }
        input {
            padding: 8px;
            font-size: 16px;
            width: 250px;
            margin-right: 5px;
        }
        button {
            padding: 8px 15px;
            font-size: 16px;
            cursor: pointer;
            margin: 5px;
        }
        #paragrafo {
            margin-top: 35px;
            font-size: 26px;
            font-weight: bold;
            color: red;
        }
    </style>
</head>
<body>

    <h1>JQuery e metodo Text/Val</h1>
    <br /><br />

    <!-- Campo di input e pulsanti di controllo -->
    <input type="text" id="modifica" placeholder="Inserisci il testo modificato">
    <button onclick="cambia()">Modifica testo</button>
    <button onclick="reset()">Resetta</button>

    <!-- Blocco target -->
    <div id="paragrafo">Questo è il testo originale.</div>

    <!-- Script jQuery -->
    <script>
        // Variabile globale per memorizzare il testo iniziale
        var originale = "";

        $(document).ready(function () {
            // Salva il testo originale del div all'avvio della pagina
            originale = $("#paragrafo").text();
        });

        // Funzione per modificare il testo
        function cambia() {
            var nuovoTesto = $("#modifica").val();
            $("#paragrafo").text(nuovoTesto);
            $("#modifica").val(""); // Svuota l'input
        }

        // Funzione per ripristinare il testo originale
        function reset() {
            $("#paragrafo").text(originale);
        }
    </script>

</body>
</html>
