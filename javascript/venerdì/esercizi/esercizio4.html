<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Esercizio 4: Gestione Dinamica con jQuery</title>
    <link rel="stylesheet" href="css/esercizio4.css">
</head>
<body>

    <main class="container">
        <header>
            <h1>Gestione Dinamica della Lista</h1>
            <p>Esercizio 4 — Inserimento e rimozione interattiva con jQuery</p>
        </header>

        <section class="card">
            <!-- Sezione di input e controllo -->
            <div class="input-group">
                <!-- autocomplete="off" disattiva il completamento automatico per quel determinato campo -->
                <input type="text" id="campo-input" placeholder="Inserisci un nuovo elemento..." autocomplete="off">

                <button id="pulsante-aggiungi">Aggiungi</button>
            </div>

            <ul id="lista-elementi">
                <!-- Code... -->
            </ul>
        </section>
    </main>

    <!-- Inclusione di jQuery tramite CDN ufficiale -->
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
    <script src="js/esercizio4.js"></script>
</body>
</html>
