<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ciclo While</title>
    <style>
        body {
            font-family: sans-serif;
            text-align: center;
        }
        h1 {
            font-weight: bold;
        }
        p {
            font-size: 25px;
            color: blue;
        }
    </style>
</head>
<body>
    
    <h1>While</h1>
    
    <!-- Paragrafo destinato ad accogliere l'output generato dal ciclo while -->
    <p id="output"></p>
    
    <script>
        // ==========================================
        // 1. DICHIARAZIONE E INIZIALIZZAZIONE
        // ==========================================
        let output = "";
        let i = 1;
        
        // ==========================================
        // 2. APPLICAZIONE DEL CICLO WHILE
        // ==========================================
        /* 
        Il ciclo while esegue il blocco di istruzioni fintanto che 
        la condizione (i <= 6) risulta vera.
        */
        while (i <= 6) {
            output += "Numero: " + i + "<br>";
            i++; // Fondamentale per evitare il ciclo infinito modificando il contatore
        }
        
        // ==========================================
        // 3. AGGIORNAMENTO DINAMICO DEL DOM
        // ==========================================
        document.getElementById("output").innerHTML = output;
    </script>
    
</body>
</html>
