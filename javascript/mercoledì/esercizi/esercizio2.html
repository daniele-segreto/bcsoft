<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Esercizio JavaScript sugli Operatori</title>
    <!-- Collegamento al file CSS esterno -->
    <link rel="stylesheet" href="css/esercizio2.css">
</head>
<body>
    <div class="container">
        <h1>JavaScript</h1>
        
        <!-- Sezioni di output per visualizzare i risultati nel DOM -->

            <h2>1. Operatori Matematici</h2>
            <p id="matematici"></p>
        </div>

        <div class="section">
            <h2>2. Operatori Numerici (Negazione, Incremento, Decremento)</h2>

            <p id="relazionali"></p>
        </div>

        <div class="section">

            <p id="logici"></p>
        </div>

        <div class="section">

        </div>

    <!-- Collegamento al file JavaScript esterno -->
    <script src="js/esercizio2.js"></script>
