<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Esercizio JavaScript sui Controlli di Flusso</title>
    <!-- Collegamento al file CSS esterno -->
    <link rel="stylesheet" href="css/esercizio3.css">
</head>
<body>
    <div class="container">
        <h1>JavaScript</h1>
        
        <!-- Sezioni di output per visualizzare i risultati nel DOM -->
        <div class="section">
            <h2>1. Struttura condizionale (if, else if, else)</h2>
            <p id="condizionale-if"></p>
        </div>

        <div class="section">
            <h2>2. Struttura di selezione (switch, case, break)</h2>
            <p id="seleziona-switch"></p>
        </div>

        <div class="section">
            <h2>3. Ciclo Iterativo (for)</h2>
            <p id="ciclo-for"></p>
        </div>

        <div class="section">
            <h2>4. Ciclo Iterativo (while)</h2>
            <p id="ciclo-while"></p>
        </div>

        <div class="section">
            <h2>5. Ciclo Iterativo (do...while)</h2>
            <p id="ciclo-do-while"></p>
        </div>
    </div>

    <!-- Collegamento al file JavaScript esterno -->
    <script src="js/esercizio3.js"></script>
</body>
</html>
