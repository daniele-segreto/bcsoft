<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ciclo For</title>
    <style>
        /* Regole CSS per definire la formattazione e lo stile del testo */
        body {
            font-family: sans-serif;
            text-align: center;
        }
        h1 {
            font-weight: bold;
        }
        p {
            font-size: 25px;
            color: blue;
        }
    </style>
</head>
<body>
    
    <h1>For</h1>
    
    <!-- Paragrafo destinato ad accogliere l'output generato dal ciclo -->
    <p id="output"></p>
    
    <script>
        // ==========================================
        // 1. DICHIARAZIONE DELLA VARIABILE DI ACCUMULO
        // ==========================================
        let output = "";
        
        // ==========================================
        // 2. APPLICAZIONE DEL CICLO FOR
        // ==========================================
        /* 
        Il ciclo FOR si compone di tre parti fondamentali:
        - Inizializzazione: let i = 1
        - Condizione: i <= 8 (verificata prima di ogni iterazione)
        - Modifica/Incremento: i++ (eseguito al termine di ogni passaggio)
        */
        for (let i = 1; i <= 8; i++) {
            output += "Numero: " + i + "<br>";
        }
        
        
        /* 
        Nota presente nel codice originale (commentata):
        Se si desiderasse variare il passo di incremento (ad esempio avanzando di 2 in 2 -> cioè 1, 3, 5, 7), 
        la sintassi sarebbe la seguente:
        for (let i = 1; i <= 8; i += 2) { ... }
        */
        
        // ==========================================
        // 3. AGGIORNAMENTO DINAMICO DEL DOM
        // ==========================================
        // Assegniamo la stringa accumulata all'interno dell'elemento paragrafo
        document.getElementById("output").innerHTML = output;
    </script>
    
</body>
</html>
